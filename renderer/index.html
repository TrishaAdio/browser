<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" />
  <title>IP Browser</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ================= SETUP SCREEN ================= -->
  <section id="setup" class="setup">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

    <div class="card">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/>
        </svg>
      </div>
      <h1>IPv4 Configuration</h1>
      <p class="sub">Choose the IP your browsing will go through.</p>

      <div class="seg" id="modeSeg">
        <span class="seg-pill"></span>
        <button data-mode="proxy" class="active">Use Proxy IP</button>
        <button data-mode="direct">Direct (My IP)</button>
      </div>

      <div id="proxyFields" class="fields">
        <label class="lbl">Protocol</label>
        <div class="chips" id="schemeChips">
          <button data-scheme="http" class="active">HTTP</button>
          <button data-scheme="socks5">SOCKS5</button>
          <button data-scheme="socks4">SOCKS4</button>
        </div>

        <label class="lbl">IPv4 Address</label>
        <div class="ip-row">
          <div class="octets" id="octets">
            <input inputmode="numeric" maxlength="3" placeholder="192" />
            <span>.</span>
            <input inputmode="numeric" maxlength="3" placeholder="168" />
            <span>.</span>
            <input inputmode="numeric" maxlength="3" placeholder="1" />
            <span>.</span>
            <input inputmode="numeric" maxlength="3" placeholder="10" />
          </div>
          <div class="port">
            <span>:</span>
            <input id="port" inputmode="numeric" maxlength="5" placeholder="8080" />
          </div>
        </div>

        <button class="link" id="authToggle">+ Add username &amp; password (optional)</button>
        <div class="auth" id="authBox">
          <input id="user" placeholder="Username" autocomplete="off" />
          <input id="pass" type="password" placeholder="Password" autocomplete="off" />
        </div>
      </div>

      <label class="check">
        <input type="checkbox" id="remember" checked />
        <span class="box"></span> Remember this configuration
      </label>

      <div class="status" id="status"></div>

      <div class="actions">
        <button class="btn ghost" id="testBtn">Test Connection</button>
        <button class="btn primary" id="startBtn">
          <span>Start Browsing</span>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- ================= BROWSER ================= -->
  <section id="browser" class="browser hidden">
    <header class="tabbar">
      <div class="tabs" id="tabs"></div>
      <button class="icon newtab" id="newTabBtn" title="New tab (Ctrl+T)">+</button>
      <div class="drag"></div>
    </header>

    <nav class="toolbar">
      <button class="icon" id="backBtn" title="Back (Alt+←)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="icon" id="fwdBtn" title="Forward (Alt+→)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <button class="icon" id="reloadBtn" title="Reload (F5)">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
      </button>
      <button class="icon" id="homeBtn" title="Home">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>
      </button>

      <form class="omnibox" id="omnibox">
        <svg class="lock" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input id="url" placeholder="Search Google or type a URL" spellcheck="false" />
      </form>

      <button class="ip-badge" id="ipBadge" title="Change IP configuration">
        <span class="dot"></span>
        <span id="ipText">—</span>
      </button>
    </nav>
    <div class="progress" id="progress"></div>

    <main class="views" id="views"></main>
  </section>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
